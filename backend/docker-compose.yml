version: "3.8"

services:
  backend:
    build: .
    container_name: admin-backend
    ports:
      - "5001:5000"
      - "5555:5555"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:14
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: prisma_user
      POSTGRES_PASSWORD: prisma_password
      POSTGRES_DB: prisma_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: