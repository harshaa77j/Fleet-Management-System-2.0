<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Set Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }
    .box {
      background: white;
      padding: 24px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    .msg {
      margin-top: 10px;
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h3>Set Your Password</h3>

    <input type="password" id="password" placeholder="New password" />
    <input type="password" id="confirm" placeholder="Confirm password" />

    <button onclick="setPassword()">Set Password</button>

    <div class="msg" id="msg"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (!token) {
    document.getElementById("msg").innerText = "Invalid or missing token.";
  }

  async function setPassword() {
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    const msg = document.getElementById("msg");

    if (!password || !confirm) {
      msg.innerText = "Please fill all fields";
      return;
    }

    if (password !== confirm) {
      msg.innerText = "Passwords do not match";
      return;
    }

    try {
      const res = await fetch("/auth/set-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password })
      });

      const data = await res.json();

      if (!res.ok) {
        msg.innerText = data.message || "Error setting password";
        return;
      }

      msg.style.color = "green";
      msg.innerText = "Password set successfully. You can now log in.";

    } catch (err) {
      msg.innerText = "Server error";
    }
  }
</script>

</body>
</html>
