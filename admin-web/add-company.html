<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Company</title>
    <link rel="stylesheet" href="css/add-company.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <h1>Add Company</h1>
        <button class="btn secondary" onclick="goBack()">⬅ Back to Dashboard</button>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="card">
            <h2>Company Details</h2>

            <form id="companyForm">
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="name" placeholder="Enter company name" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" placeholder="Enter phone number" required>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="Enter address" required>
                </div>

                <button type="submit" class="btn primary">Create Company</button>
            </form>
        </div>

        <!-- Success Box -->
        <div id="successBox" class="success-box">
            <h3>✅ Company Created Successfully</h3>
            <p><strong>Activation Key:</strong></p>
            <p id="activationKey" class="activation-key"></p>
        </div>
    </main>

    <script src="js/add-company.js"></script>
</body>
</html>
